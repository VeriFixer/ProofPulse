name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Docker image
        run: docker build --tag proofpulse-ci .

      - name: Run full test suite
        run: docker run --rm -e CI=true proofpulse-ci
