<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="1" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2b3d5c" stroke-width="1.5"/>
  <!-- pulse line: flat, small beat, then a checkmark spike, flat -->
  <path d="M32 134 H66 L80 108 L94 134 H108 L130 170 L210 62"
        fill="none" stroke="url(#pulse)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- coverage dots -->
  <circle cx="56" cy="200" r="8" fill="#ff5c5c"/>
  <circle cx="84" cy="200" r="8" fill="#ffc83d"/>
  <circle cx="112" cy="200" r="8" fill="#9a5cff"/>
</svg>
